name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install KeePass (for the KeePass.exe assembly reference)
        shell: pwsh
        run: |
          $keepassDir = "C:\Program Files\KeePass Password Safe 2"
          $keePassExe = Join-Path $keepassDir "KeePass.exe"
          if (-not (Test-Path $keePassExe)) {
            $zip = "$env:TEMP\KeePass.zip"
            $urls = @(
              "https://sourceforge.net/projects/keepass/files/KeePass%202.x/2.42.1/KeePass-2.42.1.zip/download",
              "https://downloads.sourceforge.net/project/keepass/KeePass%202.x/2.42.1/KeePass-2.42.1.zip",
              "https://netix.dl.sourceforge.net/project/keepass/KeePass%202.x/2.42.1/KeePass-2.42.1.zip"
            )
            $downloaded = $false
            foreach ($url in $urls) {
              Write-Host "Downloading KeePass 2.42.1 from $url"
              & curl.exe -L -sS --retry 3 -o $zip -w "http=%{http_code} size=%{size_download}`n" $url
              if ($LASTEXITCODE -eq 0 -and (Test-Path $zip) -and (Get-Item $zip).Length -gt 1000000) {
                $downloaded = $true
                break
              }
            }
            if (-not $downloaded) {
              throw "Failed to download KeePass 2.42.1 package"
            }
            New-Item -ItemType Directory -Force $keepassDir | Out-Null
            Expand-Archive -LiteralPath $zip -DestinationPath $keepassDir -Force
          }
          if (Test-Path $keePassExe) {
            Write-Host "KeePass.exe installed at $keepassDir"
          } else {
            throw "Failed to install KeePass.exe"
          }

      - name: Create post-build copy destination
        shell: pwsh
        run: |
          $dest = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "KeePass\Plugins"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Write-Host "Created $dest"

      - name: Resolve .NET Framework reference assemblies
        shell: pwsh
        run: |
          $root = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework"
          $dir = Get-ChildItem -LiteralPath $root -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^v(3|4)(\.\d+)+$' } |
            Sort-Object { [version]($_.Name.TrimStart('v')) } |
            Select-Object -Last 1
          if ($null -eq $dir) { throw "No .NET Framework reference assemblies found under $root" }
          $path = Join-Path $root $dir.Name
          Add-Content -Path $env:GITHUB_ENV -Value "FRAMEWORK_PATH_OVERRIDE=$path"
          Write-Host "Using .NET Framework reference assemblies: $path"

      - name: Build KeePass-DarkMode.dll
        shell: cmd
        run: msbuild KeePass-DarkMode.sln /p:Configuration=Release "/p:FrameworkPathOverride=%FRAMEWORK_PATH_OVERRIDE%" /m /fl "/flp:logfile=msbuild.log;verbosity=normal"

      - name: Upload MSBuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-log
          path: msbuild.log

      - name: Package KeePassDarkMode.plgx
        shell: pwsh
        run: |
          $plgxDir = Join-Path $env:GITHUB_WORKSPACE "build\PlgX"
          New-Item -ItemType Directory -Force $plgxDir | Out-Null
          robocopy "KeePass-DarkMode" $plgxDir /E /XD bin obj .git .vs .idea /XF *.pdb *.suo *.user KeePass-DarkMode.dll KeePass-DarkMode.plgx build.cmd plgxexclude.txt /NFL /NDL /NJH /NJS /NC /NS | Out-Null
          & "C:\Program Files\KeePass Password Safe 2\KeePass.exe" /plgx-create $plgxDir --debug --plgx-prereq-net:4.0
          # KeePass schreibt die Ausgabe als '<dir>.plgx' neben das Quellverzeichnis,
          # nicht ins aktuelle Verzeichnis — genau dort abholen.
          # KeePass leitet den Plugintyp aus dem plgx-Dateinamen ab:
          # '<BaseFileName>.<BaseFileName>Ext' (PluginManager.CreatePluginInstance).
          # Die Klasse heißt KeePassDarkMode.KeePassDarkModeExt — der Dateiname
          # MUSS KeePassDarkMode.plgx lauten, sonst schlägt der Type-Load fehl.
          $plgxOut = "$plgxDir.plgx"
          if (-not (Test-Path $plgxOut)) { throw "KeePass /plgx-create produced no output at $plgxOut" }
          Move-Item -LiteralPath $plgxOut -Destination "KeePassDarkMode.plgx" -Force
          # Safety net: verify the packaged plgx declares the right base name.
          $bytes = [System.IO.File]::ReadAllBytes("KeePassDarkMode.plgx")
          $head = [System.Text.Encoding]::UTF8.GetString($bytes[0..200])
          if ($head -notmatch 'KeePassDarkMode') { throw "plgx BaseFileName sanity check failed" }
          Remove-Item -Recurse -Force $plgxDir
          Write-Host "Created KeePassDarkMode.plgx ($((Get-Item KeePassDarkMode.plgx).Length) bytes)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeePass-DarkMode
          path: |
            KeePass-DarkMode/bin/Release/KeePass-DarkMode.dll
            KeePassDarkMode.plgx

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            KeePassDarkMode.plgx
            KeePass-DarkMode/bin/Release/KeePass-DarkMode.dll
