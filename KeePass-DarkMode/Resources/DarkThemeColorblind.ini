Link = (86, 180, 233)
ToolStrip = (56, 56, 58)
ToolStripHighlight = (230, 159, 0)
ToolStripBorder = (40, 40, 40)
Error = (213, 94, 0)
TreeViewHighlight = (0, 114, 189)

