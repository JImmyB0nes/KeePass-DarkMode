;
; KeePass-DarkMode theme template
;
; NOTE: all color values are intentionally empty - they mean "keep the
; plugin default". This file is a starting point for the theme editor,
; not a usable theme by itself. Do not select it as-is; open it in
; Tools -> Options -> KeePass-DarkMode -> Open Editor and fill in colors.
;
; You can assign individual color to each property
; or create and use color from the palette.
;
; Valid color formats: #rrggbb, #rgb, (128, 128, 128)
;
; Valid values for
; - BorderStyle: None, FixedSingle, Fixed3D
; - FlatStyle: Flat, Popup, Standard, System
; - BackgroundImageAlignment: TopLeft, TopCenter, TopRight, MiddleLeft, MiddleCenter, MiddleRight, BottomLeft, BottomCenter, BottomRight
; - BackgroundImage: <filename>
;
; Empty value = keep the plugin default (the built-in Dark Theme value).
;

